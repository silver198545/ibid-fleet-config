# images/brc-cross-search-xsearch/ 配下の変更がmainにマージされたら、
# brc-cross-search (Sinatra + Puma, feature/docker-app-modeブランチ)の
# 「横断検索」(APP_MODE=xsearch)サーバーイメージをビルドしてGHCRへ公開する。
# タグは images/brc-cross-search-xsearch/TAG の内容、取り込むアプリ側のコミットは
# images/brc-cross-search-xsearch/SRC_REF の内容。公開後、envs/<env>/apps/brc-cross-search-xsearch/deployment.yaml の
# image タグを切り替える(docs/manual-apps.md参照)。
# 同じソースの brc-cross-search-resource は build-brc-cross-search-resource-image.yaml が別途公開する。
#
# brc-cross-search(d-usuda/brc-cross-search)はd-usudaアカウント所有のプライベート
# リポジトリ(silver198545はcollaborator)のため、ソース取得には
# BRC_CROSS_SEARCH_ACCESS_TOKEN シークレット(silver198545で専用に新規発行した`repo`スコープの
# Personal access token(classic)。他ユーザー所有のリポジトリはfine-grained PATの対象に
# できず、Deploy Keyの登録にはリポジトリのadmin権限が要るため)が必要
# (このリポジトリのSettings > Secrets and variables > Actionsで事前に登録しておくこと。
# xsearch/resourceの両ワークフローで共用する)。
# 認証情報をDockerイメージのビルドコンテキスト/レイヤー履歴に残さないよう、
# cloneはDockerfile内ではなくこのワークフローのactions/checkoutステップで行う。
# PATでコミットSHAを直接fetchすると403になるため、metadatabase-v2と同じく
# ブランチ名でfetchしてからローカルでSRC_REFをcheckoutする(docs/manual-apps.md参照)。
#
# GHCR上の brc-cross-search-xsearch パッケージは非公開のまま運用する(ソースが非公開のリポジトリのため)。
# クラスタからのpullにはGHCR pull用SealedSecret(ghcr-brc-cross-search-xsearch)が必要(docs/manual-apps.md参照)。

name: build-brc-cross-search-xsearch-image

on:
  push:
    branches: [main]
    paths:
      - "images/brc-cross-search-xsearch/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SRC_REFを読み込む
        id: src_ref
        run: echo "ref=$(tr -d '[:space:]' < images/brc-cross-search-xsearch/SRC_REF)" >> "$GITHUB_OUTPUT"

      - name: アプリ本体(プライベートリポジトリ)をブランチで取得
        uses: actions/checkout@v4
        with:
          repository: d-usuda/brc-cross-search
          ref: feature/docker-app-mode
          token: ${{ secrets.BRC_CROSS_SEARCH_ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: images/brc-cross-search-xsearch/app

      - name: SRC_REFのコミットへローカルで固定
        working-directory: images/brc-cross-search-xsearch/app
        run: git checkout "${{ steps.src_ref.outputs.ref }}"

      - name: イメージをビルドしてGHCRへpush
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < images/brc-cross-search-xsearch/TAG)"
          IMAGE="ghcr.io/${{ github.repository_owner }}/brc-cross-search-xsearch:$TAG"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" images/brc-cross-search-xsearch
          docker push "$IMAGE"
          echo "公開しました: $IMAGE"
