# images/brc-cross-search-resource/ 配下の変更がmainにマージされたら、
# brc-cross-search (Sinatra + Puma, feature/docker-app-modeブランチ)の
# 「個別アプリ」(APP_MODE=resource)サーバーイメージをビルドしてGHCRへ公開する。
# タグは images/brc-cross-search-resource/TAG の内容、取り込むアプリ側のコミットは
# images/brc-cross-search-resource/SRC_REF の内容。公開後、envs/<env>/apps/brc-cross-search-resource/deployment.yaml の
# image タグを切り替える(docs/manual-apps.md参照)。
# 同じソースの brc-cross-search-xsearch は build-brc-cross-search-xsearch-image.yaml が別途公開する。
#
# brc-cross-search(d-usuda/brc-cross-search)は公開リポジトリのため、ソース取得に
# Deploy Key/PAT等の認証情報は不要(sparqlistと同じ)。
#
# 初回のみ: 公開されたパッケージ(ghcr.io上の brc-cross-search-resource)の可視性をGitHubの
# Package設定で public にすること。publicにしておくことで、GHCR pull用SealedSecretも
# imagePullSecretsも不要になる。

name: build-brc-cross-search-resource-image

on:
  push:
    branches: [main]
    paths:
      - "images/brc-cross-search-resource/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SRC_REFを読み込む
        id: src_ref
        run: echo "ref=$(tr -d '[:space:]' < images/brc-cross-search-resource/SRC_REF)" >> "$GITHUB_OUTPUT"

      - name: アプリ本体(公開リポジトリ)をSRC_REF固定で取得
        uses: actions/checkout@v4
        with:
          repository: d-usuda/brc-cross-search
          ref: ${{ steps.src_ref.outputs.ref }}
          path: images/brc-cross-search-resource/app

      - name: イメージをビルドしてGHCRへpush
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < images/brc-cross-search-resource/TAG)"
          IMAGE="ghcr.io/${{ github.repository_owner }}/brc-cross-search-resource:$TAG"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" images/brc-cross-search-resource
          docker push "$IMAGE"
          echo "公開しました: $IMAGE"
