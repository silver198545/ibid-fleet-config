# 環境間プロモーションPRの自動生成(手動起動)。
# 指定したサイト(または本番に既にある全サイト)の設定を dev→production へ丸ごとコピーし、
# PRを作成する。PRのdiffがそのまま変更レビューになり、マージが昇格の承認になる。
# envs/production/ 配下はCODEOWNERSにより承認必須。
# 環境ごとに変わる値は各fleet.yaml内で書き分けてあるため、コピー後の手直しは不要
# (docs/operations-flow.md「環境差分の書き方」)。
#
# 注意: github.token で作成されたPRでは validate ワークフローが自動起動しない
# (GitHub Actionsの再帰防止仕様)。ブランチ保護で validate を必須チェックにする場合は、
# リポジトリのSecretsに PROMOTE_TOKEN(repo権限のPAT)を登録すること。
# 登録があればそちらを優先して使う。
name: promote

on:
  workflow_dispatch:
    inputs:
      site:
        description: "サイト名(all で本番に既にある全サイトを更新。新規サイトは名前を指定)"
        type: string
        required: true
        default: all

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}

      - name: 昇格内容をコピーしてPRを作成
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || github.token }}
          FROM_ENV: dev
          TO_ENV: production
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail

          if [ "$SITE" = "all" ]; then
            # 本番に既にあるサイトだけを昇格元と同期する。devにしか無いサイト(本番未展開)は
            # 対象外で、本番への新規追加はサイト名を指定して行う(SealedSecret等の準備が要るため)。
            # devから消えたサイトも本番からは消さない(サイト削除は docs/manual-wordpress.md の手動手順)。
            # --checksum: checkout直後はmtimeが揃うため、同サイズの変更(0.4.0→0.5.0等)をrsyncの
            # quick checkが取りこぼす。内容比較を強制する。
            for dir in envs/$TO_ENV/sites/*/; do
              name="$(basename "$dir")"
              if [ -d "envs/$FROM_ENV/sites/$name" ]; then
                rsync -a --checksum --delete "envs/$FROM_ENV/sites/$name/" "envs/$TO_ENV/sites/$name/"
              else
                echo "警告: envs/$FROM_ENV/sites/$name が無いため $name はスキップします" >&2
              fi
            done
            SUBJECT="本番の全サイトを${FROM_ENV}から${TO_ENV}へ昇格"
          else
            if [ ! -d "envs/$FROM_ENV/sites/$SITE" ]; then
              echo "エラー: envs/$FROM_ENV/sites/$SITE がありません" >&2
              exit 1
            fi
            rm -rf "envs/$TO_ENV/sites/$SITE"
            cp -r "envs/$FROM_ENV/sites/$SITE" "envs/$TO_ENV/sites/$SITE"
            SUBJECT="サイト${SITE}を${FROM_ENV}から${TO_ENV}へ昇格"
          fi

          # コピーは新規ファイル(未追跡)になり得るため、addしてから差分判定する
          git add "envs/$TO_ENV"
          if git diff --cached --quiet; then
            echo "昇格元と昇格先に差分がありません。PRは作成しません。"
            exit 0
          fi

          BRANCH="promote/${FROM_ENV}-to-${TO_ENV}-${SITE}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: ${SUBJECT}"
          git push origin "$BRANCH"

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## 昇格内容

          \`envs/$FROM_ENV/sites\` → \`envs/$TO_ENV/sites\` (対象: $SITE)

          ## マージ前チェックリスト

          - [ ] diffの内容(チャートバージョン/values/イメージの変更点)を確認した
          - [ ] チャート/イメージ更新を含む場合、changelogに破壊的変更(DBマイグレーション等)がないか確認した
          - [ ] diffが昇格させたい変更(helm.version、plugins等)だけで、環境固有の値の直書きが混ざっていない
          - [ ] コア/プラグイン更新でDBマイグレーションを伴う場合、dev1の本番データリハーサルで確認した(docs/operations-flow.md)
          - [ ] 対象サイトの本番バックアップ(Longhorn/DBダンプ)を取得した
          - [ ] devで対象サイトが正常稼働していることを確認した

          🤖 Generated with promote.yaml
          EOF

          gh pr create \
            --title "chore: ${SUBJECT}" \
            --body-file "$BODY_FILE" \
            --base main \
            --head "$BRANCH"
