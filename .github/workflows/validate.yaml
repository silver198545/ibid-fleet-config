# PRごとの検証: YAML構文、Rundeckのジョブ定義の生成結果、GitHub Actionsワークフロー(actionlint)、サイトfleet.yamlの必須項目、
# アプリのIngressのホスト名、
# ラッパーチャートのlint/render。
# ブランチ保護でこのチェックを必須にすること(docs/manual-multi-env.md 参照)。
name: validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PyYAMLをインストール
        run: pip install --quiet pyyaml

      - name: 全YAMLファイルの構文チェック
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml

          failed = False
          # globは隠しディレクトリ(.github)に入らないため、ワークフローは別に足す
          # (2026-10-10、auto-update.yamlの構文エラーがこのチェックを素通りした)
          paths = glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True)
          paths += glob.glob(".github/**/*.yaml", recursive=True) + glob.glob(".github/**/*.yml", recursive=True)
          for path in paths:
              if path.startswith("charts/ibid-wordpress/charts/"):
                  continue  # helm dependency buildの生成物
              if path.startswith("charts/ibid-wordpress/templates/"):
                  continue  # Helmテンプレート({{ }}構文)は素のYAMLでは不正。helm lint/templateで検証する
              try:
                  with open(path) as f:
                      list(yaml.safe_load_all(f))
              except yaml.YAMLError as e:
                  print(f"NG {path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Rundeckのジョブ定義が最新か
        # rundeck/jobs/*.yaml は envs/dev/ のアプリ・サイト一覧から生成する(docs/manual-rundeck.md)
        run: python3 rundeck/generate-jobs.py --check

      - name: GitHub Actionsワークフローの検査(actionlint)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          # https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "${ACTIONLINT_SHA256}  /tmp/$tgz" | sha256sum -c -
          tar xzf "/tmp/$tgz" -C /tmp actionlint
          # run: 内のシェルはshellcheckでも検査される(ランナーに標準で入っている)
          /tmp/actionlint -no-color

      - name: サイトfleet.yamlの必須項目チェック
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml

          failed = False
          for path in glob.glob("envs/*/sites/*/fleet.yaml"):
              with open(path) as f:
                  doc = yaml.safe_load(f)
              helm = doc.get("helm") or {}
              problems = []
              if not doc.get("keepResources"):
                  problems.append("keepResources: true がない(サイト削除時にPVCごと消える)")
              if not helm.get("releaseName"):
                  problems.append("helm.releaseName がない")
              if not helm.get("chart"):
                  problems.append("helm.chart がない")
              if not helm.get("version"):
                  problems.append("helm.version がない(バージョン固定必須)")
              # パスワード類の混入防止(existingSecret参照のみ許可)。コメント行は除外。
              lines = [l for l in open(path) if not l.lstrip().startswith("#")]
              for ng in ("rootPassword", "wordpressPassword", "password:"):
                  if any(ng in l for l in lines):
                      problems.append(f"パスワードらしき記述 '{ng}' がある(Secret経由で注入すること)")
              # 昇格=丸ごとコピーを成立させるため、環境名は直書きせずクラスタラベルから展開する
              # (docs/operations-flow.md「環境差分の書き方」)
              hostname = (((helm.get("values") or {}).get("wordpress") or {}).get("ingress") or {}).get("hostname", "")
              if hostname and "${ .ClusterLabels.env }" not in hostname:
                  problems.append("ingress.hostname に環境名が直書きされている: " + hostname
                                  + "(<site>.${ .ClusterLabels.env }.ibid.lan とすること)")
              for p in problems:
                  print(f"NG {path}: {p}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: アプリのIngressのホスト名チェック
        # アプリは直下のマニフェストをdevの値で書き、staging・productionは overlays/<env>/ingress_patch.yaml で
        # ホスト名を変える(docs/operations-flow.md「環境差分の書き方」)。overlayのコピー漏れで
        # 別環境のホスト名のまま出ていくのを防ぐ。
        run: |
          python3 - <<'EOF'
          import glob, os, sys, yaml

          failed = False
          for app_dir in sorted(glob.glob("envs/*/apps/*/")):
              checks = [("dev", os.path.join(app_dir, "ingress.yaml"))]
              checks += [(env, os.path.join(app_dir, "overlays", env, "ingress_patch.yaml")) for env in ("staging", "production")]
              for env, path in checks:
                  if not os.path.exists(path):
                      # 変更はdevから入るので、overlayが揃っているべきなのはdev。staging・productionは昇格待ちのことがある
                      if env != "dev" and app_dir.startswith("envs/dev/"):
                          print(f"NG {path}: ありません(<app>.{env}.ibid.lan のホスト名を書いたパッチが必要)")
                          failed = True
                      continue
                  spec = (yaml.safe_load(open(path)) or {}).get("spec") or {}
                  hosts = [r.get("host", "") for r in spec.get("rules") or []]
                  hosts += [h for t in spec.get("tls") or [] for h in t.get("hosts") or []]
                  for h in hosts:
                      if not h.endswith(f".{env}.ibid.lan"):
                          print(f"NG {path}: ホスト名 {h} が .{env}.ibid.lan で終わっていない")
                          failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: QAのチェック定義
        # 本番への昇格PRはstagingのQAを求める(qa-gate.yaml)。チェックの無いアプリは本番へ出せなくなるため、
        # devにあるアプリはすべて qa/checks.yaml に載っていること(docs/operations-flow.md「QAゲート」)
        run: |
          python3 - <<'EOF'
          import os, sys, yaml

          known = {"path", "status", "contains", "json", "min_items", "key", "min_number", "max_seconds", "same_as_production"}
          conf = yaml.safe_load(open("qa/checks.yaml"))
          failed = False
          for app in sorted(os.listdir("envs/dev/apps")):
              if not conf["apps"].get(app):
                  print(f"NG qa/checks.yaml: アプリ {app} のチェックがありません")
                  failed = True
          for name, checks in list(conf["apps"].items()) + [("sites", conf["sites"])]:
              for c in checks or []:
                  if "path" not in c or set(c) - known:
                      print(f"NG qa/checks.yaml: {name} のチェックに path が無い、または不明な項目: {c}")
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: 脆弱性チェックの基準と除外
        # qa/vuln-policy.yaml(docs/manual-vuln-scan.md)。除外には理由と期限が要る
        run: |
          python3 - <<'EOF'
          import datetime, sys, yaml

          p = yaml.safe_load(open("qa/vuln-policy.yaml")) or {}
          failed = False
          def ng(msg):
              global failed
              print(f"NG qa/vuln-policy.yaml: {msg}")
              failed = True
          if not isinstance(p.get("enforce"), bool):
              ng("enforce は true か false")
          if not isinstance(p.get("eol_warn_days"), int):
              ng("eol_warn_days は日数(整数)")
          unknown = set(p) - {"enforce", "eol_warn_days", "ignore"}
          if unknown:
              ng(f"不明な項目: {sorted(unknown)}")
          for r in p.get("ignore") or []:
              if not isinstance(r, dict) or not r.get("id") or not r.get("reason") or not r.get("until"):
                  ng(f"除外には id・reason・until が要ります: {r}")
                  continue
              if set(r) - {"id", "targets", "pkg", "reason", "until"}:
                  ng(f"除外に不明な項目: {r}")
              until = r["until"]
              if isinstance(until, str):
                  try:
                      until = datetime.date.fromisoformat(until)
                  except ValueError:
                      ng(f"until は YYYY-MM-DD: {r}")
                      continue
              if not isinstance(until, datetime.date):
                  ng(f"until は YYYY-MM-DD: {r}")
              elif until < datetime.date.today():
                  print(f"::warning::qa/vuln-policy.yaml の除外 {r['id']} は期限切れです({until})。見直してください")
          sys.exit(1 if failed else 0)
          EOF

      - name: ラッパーチャートの lint と render
        run: |
          # helm dependency build はローカルのリポジトリ一覧に定義が無いと失敗する
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/ibid-wordpress
          helm lint charts/ibid-wordpress
          # サイト相当のvaluesを与えてrenderが通ることを確認する
          cat > /tmp/site-values.yaml <<'EOF'
          # plugins はプラグイン同期Jobのテンプレートを必ずレンダリングさせるために指定
          # (version省略・activate: false の分岐も含めて網羅する)
          plugins:
            - name: test-plugin-pinned
              version: "1.2.3"
            - name: test-plugin-latest
            - name: test-plugin-noactivate
              version: "2.0.0"
              activate: false
          wordpress:
            existingSecret: wordpress-test-credentials
            mariadb:
              auth:
                existingSecret: wordpress-test-mariadb-credentials
                rootPassword: "dummy"
                password: "dummy"
          EOF
          helm template wordpress-test charts/ibid-wordpress \
            -n wordpress-test -f /tmp/site-values.yaml > /tmp/rendered.yaml
          # プラグイン同期Jobの生成スクリプトを取り出してbashの構文チェックにかける
          # (テンプレートの空白トリムによるコマンド連結事故などを検知する)
          python3 - <<'EOF'
          import yaml
          script = None
          for doc in yaml.safe_load_all(open("/tmp/rendered.yaml")):
              if doc and doc.get("kind") == "Job" and "plugin-sync" in doc["metadata"]["name"]:
                  script = doc["spec"]["template"]["spec"]["containers"][0]["command"][2]
          assert script, "plugin-sync Jobがレンダリングされていない"
          open("/tmp/plugin-sync.sh", "w").write(script)
          backup = None
          for doc in yaml.safe_load_all(open("/tmp/rendered.yaml")):
              if doc and doc.get("kind") == "CronJob" and doc["metadata"]["name"].endswith("-backup"):
                  backup = doc["spec"]["jobTemplate"]["spec"]["template"]["spec"]["containers"][0]["command"][2]
          assert backup, "バックアップCronJobがレンダリングされていない"
          open("/tmp/backup.sh", "w").write(backup)
          EOF
          bash -n /tmp/plugin-sync.sh
          bash -n /tmp/backup.sh
          echo "render OK (plugin-sync Job・バックアップCronJobのbash構文チェック含む)"
