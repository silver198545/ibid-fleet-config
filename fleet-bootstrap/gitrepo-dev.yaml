# dev環境用GitRepo。Rancher localクラスタの fleet-default namespaceへ手動適用する。
# envs/dev/ 配下のみを監視し、env=dev ラベルのクラスタへ適用する。
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: ibid-dev
  namespace: fleet-default
spec:
  repo: https://github.com/silver198545/ibid-fleet-config
  # リポジトリは2026-07-08にpublicへ戻したため、認証は現在は不要(Secretは残してある。
  # 将来private化する場合に使う)。詳細は fleet-bootstrap/README.md。
  clientSecretName: auth-55znx
  branch: main
  paths:
    - envs/dev
  targets:
    - name: dev
      clusterSelector:
        matchLabels:
          env: dev
