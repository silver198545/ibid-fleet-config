- name: 3-production-promote
  uuid: 8f2bcfd1-7e89-5b25-befb-af7ea1f65605
  description: |
    【本番昇格パイプライン】

    stagingと本番で差分のあるサイトをstagingでQAし(通らなければPRを作らない)、
    昇格PR(staging→production)を promote ワークフローで作り、CI通過後に
    対象サイトの本番バックアップを取って(結果はPRにコメントする。本番の権限が無いオペレータが実行した場合は取らず、
    「承認する管理者がマージ直前に tools/backup で取る」とPRにコメントする)、**人がPRをレビュー・マージするのを待つ
    (このジョブはマージしない)**。マージされたらFleetの適用(Helmリビジョンの更新とrollout)を待ち、
    本番のHTTP 200・Pod・MariaDBのアップグレード状況を確認する。差分が無ければ確認だけ行う。

    **本番へはstagingに載っている内容を昇格する**(先に「2-staging」で確認しておく)。all はstagingに載っている、
    本番にある全サイトが対象。本番に無いサイトを追加するときはサイト名を選ぶ
    (先に scripts/seal-site-secrets.sh production <site> のSecretをmainへ入れておくこと)。
    終わったら「4-staging-cleanup」でstagingから削除する。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 10h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: sites
    description: 昇格するサイト(all、または複数選択)
    required: true
    value: all
    values:
    - all
    - abc
    - abc-en
    - acd
    - acd-en
    - cell
    - cell-en
    - dgprt
    - dgprt-en
    - dna
    - dna-en
    - epd
    - epd-en
    - hdm
    - hdm-en
    - iddd
    - iddd-en
    - info
    - info-en
    - jcm
    - jcm-en
    - jmc
    - jmc-en
    - kougaku
    - kougaku-en
    - mgen
    - mgen-en
    - mus
    - mus-en
    - pms
    - pms-en
    - tet
    - tet-en
    - web
    - web-en
    valuesListDelimiter: ','
    enforced: true
    multivalued: true
    delimiter: ' '
  - name: merge_wait_minutes
    description: 本番PRのレビュー・マージを待つ時間(分)。過ぎたらジョブは失敗で終わる(PRはそのまま残る)
    required: true
    value: '240'
    values:
    - '60'
    - '120'
    - '240'
    - '480'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: 昇格PR作成 → 本番バックアップ → 人のマージ待ち → 反映確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        MERGE_WAIT_MINUTES='@option.merge_wait_minutes@' scripts/wordpress-pipeline.sh promote-production @option.sites@
      scriptInterpreter: /bin/bash
