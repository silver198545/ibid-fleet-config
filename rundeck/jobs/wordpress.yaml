# 自動生成ファイル。直接編集せず rundeck/generate-jobs.py を直して再生成すること。
# 取り込み先のRundeckプロジェクト: WordPressControl
# 取り込み: rd jobs load -p WordPressControl -f rundeck/jobs/wordpress.yaml --format yaml
# 説明: docs/manual-rundeck.md
- name: 1-dev-refresh
  uuid: 94c91d87-8aa7-5401-9238-aeea08a0690a
  description: |
    【開発環境更新パイプライン】本番コンテンツ → devの同名サイト

    選んだサイトごとに、本番のバックアップ(日次バックアップのCronJobから今すぐ1つ)を取り、
    devの現状をバックアップしてから、本番のwp-content・DBをdevへリストアする。
    続けてDB内の本番の公開URLをdevの公開URL(wp-config.phpのWP_HOME)へ置換し、HTTP 200を確認する。
    gitは触らない。チャート版・プラグイン(構成)はdevのまま変わらない。

    **devの記事・設定は本番のもので上書きされる**(上書き前のバックアップはNFSの
    backup/dev/wordpress-<site>/ に残る)。全34サイトを選ぶと数時間かかる。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 12h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: sites
    description: コンテンツを本番から戻すdevのサイト(複数選択可)
    required: true
    values:
    - abc
    - abc-en
    - acd
    - acd-en
    - cell
    - cell-en
    - dgprt
    - dgprt-en
    - dna
    - dna-en
    - epd
    - epd-en
    - hdm
    - hdm-en
    - iddd
    - iddd-en
    - info
    - info-en
    - jcm
    - jcm-en
    - jmc
    - jmc-en
    - kougaku
    - kougaku-en
    - mgen
    - mgen-en
    - mus
    - mus-en
    - pms
    - pms-en
    - tet
    - tet-en
    - web
    - web-en
    valuesListDelimiter: ','
    enforced: true
    multivalued: true
    delimiter: ' '
  - name: fresh_backup
    description: 'yes: 本番のバックアップを今すぐ取ってそれを使う(本番の権限が無いオペレータは自動でnoと同じになる) / no: 最新の日次バックアップ(JST 3:00)を使う'
    required: true
    value: 'yes'
    values:
    - 'yes'
    - 'no'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: 本番バックアップ → devバックアップ → リストア → URL置換 → 確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        FRESH_BACKUP=$([ '@option.fresh_backup@' = yes ] && echo 1 || echo 0) scripts/wordpress-pipeline.sh dev-refresh @option.sites@
      scriptInterpreter: /bin/bash
- name: 2-staging
  uuid: 15be4bb2-afc2-5020-90eb-495a36f60946
  description: |
    【stagingで本番データを使って確認する】

    選んだサイトを本番と同じ構成でstaging1に置き(stagingだけのPRなのでauto-merge)、本番の最新
    コンテンツをリストアして比較の基準(各ページのHTTPステータス・WordPress/プラグインの版)を記録する。
    upgrade=yes なら続けてdevの構成(昇格予定の helm.version・plugins)をpromoteワークフローでstagingへ昇格し
    (auto-merge)、プラグイン同期Job・DB更新(wp core update-db)の所要時間、MariaDBのアップグレード、
    ページの表示、PHPエラーを基準と比べて報告する。本番にまだ無い新規サイトはdevの構成で置くだけ。

    本番へはstagingを通して昇格する(docs/operations-flow.md「stagingでの確認」)。staging1のメモリの都合で
    同時に4サイトまで。結果は昇格PRに書き、本番へ昇格したら「4-staging-cleanup」で必ず削除する。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 6h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: site
    description: stagingで確認するサイト
    required: true
    values:
    - abc
    - abc-en
    - acd
    - acd-en
    - cell
    - cell-en
    - dgprt
    - dgprt-en
    - dna
    - dna-en
    - epd
    - epd-en
    - hdm
    - hdm-en
    - iddd
    - iddd-en
    - info
    - info-en
    - jcm
    - jcm-en
    - jmc
    - jmc-en
    - kougaku
    - kougaku-en
    - mgen
    - mgen-en
    - mus
    - mus-en
    - pms
    - pms-en
    - tet
    - tet-en
    - web
    - web-en
    valuesListDelimiter: ','
    enforced: true
  - name: fresh_backup
    description: 'yes: 本番のバックアップを今すぐ取ってそれを使う(本番の権限が無いオペレータは自動でnoと同じになる) / no: 最新の日次バックアップ(JST 3:00)を使う'
    required: true
    value: 'yes'
    values:
    - 'yes'
    - 'no'
    valuesListDelimiter: ','
    enforced: true
  - name: upgrade
    description: 'yes: 続けてdevの構成へ切り替えて確認する / no: 本番のコピーを置くところまで'
    required: true
    value: 'yes'
    values:
    - 'yes'
    - 'no'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: stagingへ追加 → 本番データのリストア → 基準の記録
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        FRESH_BACKUP=$([ '@option.fresh_backup@' = yes ] && echo 1 || echo 0) STAGING_PROJECT_ID='' scripts/wordpress-pipeline.sh staging-start '@option.site@'
      scriptInterpreter: /bin/bash
    - description: devの構成へ切り替え → 基準と比較(upgrade=yesのとき)
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        if [ '@option.upgrade@' = yes ]; then
          scripts/wordpress-pipeline.sh staging-upgrade '@option.site@'
        else
          echo 'upgrade=no のため切り替えません。あとで 2a-staging-upgrade を実行できます。'
        fi
      scriptInterpreter: /bin/bash
