    keepgoing: false
    strategy: node-first
    commands:
    - description: コミット・PR作成
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        scripts/update-app-image.sh promote-@option.env@-finish brc-advanced-search
      scriptInterpreter: /bin/bash
