  uuid: 03a4963c-2836-539a-827a-688314108141
  description: |
    metadatabase-v2 のrollout状況とWEB疎通(readinessProbeのpathで200か)を確認する(読み取りのみ)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 10m
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: env
    description: 確認する環境
    required: true
    value: dev
    values:
    - dev
    - production
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: 確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        scripts/update-app-image.sh check-@option.env@ metadatabase-v2
      scriptInterpreter: /bin/bash
- name: 1-dev-update
  group: riken-diips
  uuid: 273fcf0d-6f87-5864-b3e7-3e0251238466
  description: |
    【開発環境更新パイプライン】riken-diips

    取り込み元の最新コミット(または指定したsrc_ref)でイメージを作り直し、devへ反映して確認する。
    イメージPR → auto-merge → ビルド完了待ち → devのdeployment.yamlを更新するPR → auto-merge →
    devのrollout・WEB疎通確認、までを1回で行う(devだけのPRなので承認なしでマージされる)。

    devでブラウザ確認したら「2-production-update」で本番へ。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 90m
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: src_ref
    description: 取り込み元のコミットSHA。空欄なら取り込み元ブランチの最新を使う(現在のimages/riken-diips/SRC_REFと同じなら、イメージは更新せずdevの確認だけ行う)
    regex: ^([0-9a-f]{7,40})?$
  - name: tag
    description: 新しいイメージタグ。空欄なら現在のTAG(<version>-r<N>)から自動採番
    regex: ^([0-9A-Za-z._-]+)?$
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: イメージ更新 → ビルド → devへ反映 → devの確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        scripts/update-app-image.sh dev-update riken-diips '@option.src_ref@' '@option.tag@'
      scriptInterpreter: /bin/bash
- name: 2-production-update
  group: riken-diips
  uuid: 938bf6f9-28c6-569a-9a22-608153efd71b
  description: |
    【本番環境更新パイプライン】riken-diips

    envs/production/apps/riken-diips を dev と同じ内容にする昇格PRを promote ワークフローで作り、
    **人がPRをレビュー・マージするのを待つ(このジョブはマージしない)**。マージされたら
    mainを取り込み、Fleetの適用を待って本番のrollout・WEB疎通を確認する。
    devと本番に差分が無ければPRは作らず、確認だけ行う。

    PRのdiffはイメージタグに限らずdevに入っている変更すべて。内容を見てからマージすること。
    マージ待ちの間、クローンのロックは手放すので他のジョブは動ける。
    本番にまだ無いアプリはエラーになる(初回は「3-first-promote-prepare」)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 10h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: merge_wait_minutes
    description: 本番PRのレビュー・マージを待つ時間(分)。過ぎたらジョブは失敗で終わる(PRはそのまま残る)
    required: true
    value: '240'
    values:
    - '60'
    - '120'
    - '240'
    - '480'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: 昇格PR作成 → 人のマージ待ち → 本番の確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        MERGE_WAIT_MINUTES='@option.merge_wait_minutes@' scripts/update-app-image.sh release-production riken-diips
      scriptInterpreter: /bin/bash
- name: 3-first-promote-prepare
  group: riken-diips
  uuid: f2d89229-9574-5420-a34f-1989c7ee4a8b
