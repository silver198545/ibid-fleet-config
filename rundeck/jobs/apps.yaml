- name: 1-dev-update
  group: brc-cross-search-xsearch
  uuid: 2dd24bfd-2024-54fa-82d3-f52e252c09a9
  description: |
    【開発環境更新パイプライン】brc-cross-search-xsearch

    取り込み元の最新コミット(または指定したsrc_ref)でイメージを作り直し、devへ反映して確認する。
    イメージPR → auto-merge → ビルド完了待ち → devのdeployment.yamlを更新するPR → auto-merge →
    devのrollout・WEB疎通確認、までを1回で行う(devだけのPRなので承認なしでマージされる)。

    devでブラウザ確認したら「2-staging-update」でstagingへ。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 90m
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: src_ref
    description: 取り込み元のコミットSHA。空欄なら取り込み元ブランチの最新を使う(現在のimages/brc-cross-search-xsearch/SRC_REFと同じなら、イメージは更新せずdevの確認だけ行う)
    regex: ^([0-9a-f]{7,40})?$
  - name: tag
    description: 新しいイメージタグ。空欄なら現在のTAG(<version>-r<N>)から自動採番
    regex: ^([0-9A-Za-z._-]+)?$
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: イメージ更新 → ビルド → devへ反映 → devの確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        scripts/update-app-image.sh dev-update brc-cross-search-xsearch '@option.src_ref@' '@option.tag@'
      scriptInterpreter: /bin/bash
- name: 2-staging-update
  group: brc-cross-search-xsearch
  uuid: 2fcefb30-e956-52e3-a9aa-9ebe2c715835
  description: |
    【staging更新パイプライン】brc-cross-search-xsearch

    envs/staging/apps/brc-cross-search-xsearch を dev と同じ内容にする昇格PRを promote ワークフロー(to=staging)で作り、
    auto-mergeを待って(stagingだけのPRなので承認不要)、stagingのrollout・WEB疎通とQAを確認する。
    devとstagingに差分が無ければPRは作らず、確認だけ行う。

    stagingでブラウザ確認したら「3-production-update」で本番へ。本番へは必ずstagingを通す。
    stagingにまだ無いアプリはエラーになる(初回は「4-first-promote-prepare」を env=staging で)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 1h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options: []
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: staging昇格PR作成 → auto-merge → stagingの確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        scripts/update-app-image.sh staging-update brc-cross-search-xsearch
      scriptInterpreter: /bin/bash
- name: 3-production-update
  group: brc-cross-search-xsearch
  uuid: e60fb104-3c67-504f-b8f8-fa7251b90ce0
  description: |
    【本番環境更新パイプライン】brc-cross-search-xsearch

    stagingでQAし(通らなければPRを作らない)、
    envs/production/apps/brc-cross-search-xsearch を staging と同じ内容にする昇格PRを promote ワークフロー(to=production)で作り、
    **人がPRをレビュー・マージするのを待つ(このジョブはマージしない)**。マージされたら
    mainを取り込み、Fleetの適用を待って本番のrollout・WEB疎通を確認する。
    stagingと本番に差分が無ければPRは作らず、確認だけ行う。

    PRのdiffはイメージタグに限らずstagingに入っている変更すべて。内容を見てからマージすること。
    マージ待ちの間、クローンのロックは手放すので他のジョブは動ける。
    本番にまだ無いアプリはエラーになる(初回は「4-first-promote-prepare」を env=production で)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 10h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: merge_wait_minutes
    description: 本番PRのレビュー・マージを待つ時間(分)。過ぎたらジョブは失敗で終わる(PRはそのまま残る)
    required: true
    value: '240'
    values:
    - '60'
    - '120'
    - '240'
    - '480'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: 昇格PR作成 → 人のマージ待ち → 本番の確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        MERGE_WAIT_MINUTES='@option.merge_wait_minutes@' scripts/update-app-image.sh release-production brc-cross-search-xsearch
      scriptInterpreter: /bin/bash
