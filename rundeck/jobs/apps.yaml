      scriptInterpreter: /bin/bash
- name: 2-staging-update
  group: sparqlist
  uuid: 5dbc439b-692a-5283-a546-f4a63b382c2a
  description: |
    【staging更新パイプライン】sparqlist

    envs/staging/apps/sparqlist を dev と同じ内容にする昇格PRを promote ワークフロー(to=staging)で作り、
    auto-mergeを待って(stagingだけのPRなので承認不要)、stagingのrollout・WEB疎通とQAを確認する。
    devとstagingに差分が無ければPRは作らず、確認だけ行う。

    stagingでブラウザ確認したら「3-production-update」で本番へ。本番へは必ずstagingを通す。
    stagingにまだ無いアプリはエラーになる(初回は「4-first-promote-prepare」を env=staging で)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 1h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options: []
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: staging昇格PR作成 → auto-merge → stagingの確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        scripts/update-app-image.sh staging-update sparqlist
      scriptInterpreter: /bin/bash
- name: 3-production-update
  group: sparqlist
  uuid: a6059965-59bb-5f9e-bba4-75fb9c2e3b35
  description: |
    【本番環境更新パイプライン】sparqlist

    stagingでQAし(通らなければPRを作らない)、
    envs/production/apps/sparqlist を staging と同じ内容にする昇格PRを promote ワークフロー(to=production)で作り、
    **人がPRをレビュー・マージするのを待つ(このジョブはマージしない)**。マージされたら
    mainを取り込み、Fleetの適用を待って本番のrollout・WEB疎通を確認する。
    stagingと本番に差分が無ければPRは作らず、確認だけ行う。

    PRのdiffはイメージタグに限らずstagingに入っている変更すべて。内容を見てからマージすること。
    マージ待ちの間、クローンのロックは手放すので他のジョブは動ける。
    本番にまだ無いアプリはエラーになる(初回は「4-first-promote-prepare」を env=production で)。
  loglevel: INFO
  executionEnabled: true
  scheduleEnabled: true
  multipleExecutions: false
  timeout: 10h
  nodefilters:
    filter: 'tags: rancher'
  nodesSelectedByDefault: true
  options:
  - name: merge_wait_minutes
    description: 本番PRのレビュー・マージを待つ時間(分)。過ぎたらジョブは失敗で終わる(PRはそのまま残る)
    required: true
    value: '240'
    values:
    - '60'
    - '120'
    - '240'
    - '480'
    valuesListDelimiter: ','
    enforced: true
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
    - description: mainを最新化
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        exec 9>"$(git rev-parse --git-dir)/ibid-pipeline.lock"
        flock -w 3600 9
        if [ -n "$(git status --porcelain)" ]; then
          echo "エラー: 作業ツリーに未コミットの変更があります(初回昇格の途中など)。確認してから再実行してください。" >&2
          git status --short >&2
          exit 1
        fi
        git checkout -q main
        git pull -q --ff-only origin main
        echo "main: $(git log -1 --format='%h %s')"
      scriptInterpreter: /bin/bash
    - description: 昇格PR作成 → 人のマージ待ち → 本番の確認
      script: |
        set -euo pipefail
        cd "$HOME/ibid-fleet-config"
        export PIPELINE_ACTOR='@job.username@'
        export RUNDECK_EXEC_URL='@job.url@'
        MERGE_WAIT_MINUTES='@option.merge_wait_minutes@' scripts/update-app-image.sh release-production sparqlist
      scriptInterpreter: /bin/bash
- name: 4-first-promote-prepare
  group: sparqlist
  uuid: d9fc24c5-f5c1-59d8-a2d2-f27f16209cad
