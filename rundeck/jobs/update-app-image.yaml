# scripts/update-app-image.sh の各サブコマンドを1ジョブずつに対応させたRundeckジョブ定義。
#
# 前提・使い方: docs/manual-rundeck-app-image.md を参照。
# 取り込み方法(例): rd jobs load -p <プロジェクト名> -f rundeck/jobs/update-app-image.yaml --format yaml
#
# 各ジョブの実行対象は以下の2点で決まる(別環境へ持っていく場合はここを編集すること):
#   - nodefilters.filter: "tags: rancher"(踏み台端末=rancherホストのRundeckノードタグ)
#   - option "repo_path" の value: /home/uchida/ibid-fleet-config(踏み台端末上のクローンパス)
#
# 実行順序はscripts/update-app-image.sh冒頭コメントの使用例と同一。各ジョブの後、
# 出力(rollout状況・WEB疎通・PR URL等)を人が確認してから次のジョブを手動実行する運用を
# 前提としており、複数ジョブを自動連結するワークフローは意図的に作っていない。

- name: 01-sync-repo
  group: app-image-update
  description: |
    repo_path のローカルmainブランチをorigin/mainに同期する(git checkout main && git pull --ff-only)。
    各サブコマンドジョブはensure_clean_worktree/require_main_uptodateで同期状態を検証するが、
    PRマージ直後など明示的に同期しておきたいタイミングで実行する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && git checkout main && git pull --ff-only origin main

- name: 02-latest-src-ref
  group: app-image-update
  description: |
    取り込み元リポジトリ(upstream_repo_for/upstream_branch_forに登録済みのブランチ)の
    最新コミットSHA・コミットメッセージを表示する(書き込みなし)。
    次の03-set-imageジョブのsrc_refに使う値を、この出力を見て人が判断する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh latest-src-ref ${option.app}

- name: 03-set-image
  group: app-image-update
  description: |
    images/<app>/TAG・SRC_REFを更新するPRを作成し、CI通過後にauto-merge → イメージビルドの成功を待ち、
    続けてdevへ反映するPR(deploy-dev)の作成・auto-merge・check-devまで行う。
    src_refには必ず02-latest-src-refジョブの出力(コミットSHA)を使うこと。

    tagは空欄でよい。現在のTAGが<version>-r<N>形式(例: 2.0.0-r7)の場合、N+1で自動採番される
    (2.0.0-r7 → 2.0.0-r8)。その形式でない場合はエラーになるので、その場合のみ明示指定すること。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 60m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: tag
      description: '新しいイメージタグ(空欄可。現在のTAGから自動採番。例: 2.0.0-r7)'
      required: false
    - name: src_ref
      description: 取り込み元コミットSHA(16進数7〜40文字。02-latest-src-refジョブの出力を使う)
      required: true
      regex: '^[0-9a-f]{7,40}$'
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh set-image ${option.app} ${option.tag} ${option.src_ref}

- name: 01-deploy-dev
  group: app-image-update/dev
  description: |
    通常は03-set-imageが自動で行うため不要。set-imageがイメージビルド後に止まった場合の再開用。
    envs/dev/apps/<app>/deployment.yamlのイメージタグを更新するPRを作成し、auto-merge・check-devまで行う。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh deploy-dev ${option.app}

- name: 02-check-dev
  group: app-image-update/dev
  description: |
    01-deploy-devのPRマージ後に実行。devのrollout状況とWEB疎通(readinessProbeのpathで200か)を確認する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh check-dev ${option.app}

- name: 03-sync-dev-data
  group: app-image-update/dev
  description: |
    PVCで永続データを持つアプリ限定(persistent_data_dir_forに登録済みのアプリのみ。現状sparqlistのみ)。
    productionの永続データ(例: repository/)をdevへコピーし、本番相当データでの確認を可能にする
    (WordPressの本番データリハーサル相当。docs/manual-apps.md「devでの本番データ確認」参照)。
    **dev側の内容は上書きされる**。任意の手順で、production昇格前に必要な場合だけ実行する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名(永続データ同期に対応したアプリのみ有効。現状sparqlistのみ選択可)
      required: true
      value: sparqlist
      values:
        - sparqlist
      valuesListDelimiter: ','
      enforced: true
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh sync-dev-data ${option.app}

- name: 01-promote-production
  group: app-image-update/production
  description: |
    【新規アプリの初回昇格のみ】envs/dev/apps/<app>をenvs/production/apps/<app>へ丸ごとコピーする
    (ブランチ作成・変更のみでコミットはしない)。dev側にoverlays/production/(productionの
    ホスト名等のパッチ)が無ければエラーになる。既にproductionにあるアプリは03-deploy-productionを使う。

    実行後、ジョブ出力に表示されるkubesealコマンド(GHCR pull用SealedSecret作成)を
    踏み台端末上で人が手動実行すること(PATを扱うためRundeckジョブ化しない)。
    DNS Aレコードが未登録なら合わせて登録する。

    注意: このジョブ実行後、repo_pathの作業ツリーはpromoteブランチ・未コミット状態のまま残る。
    02-promote-production-finishを実行し終えるまで、同じrepo_pathに対する他のジョブ
    (特に01-sync-repo等、mainブランチを前提とするもの)を実行しないこと。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-production ${option.app}

- name: 02-promote-production-finish
  group: app-image-update/production
  description: |
    01-promote-productionジョブでenvs/production/secrets/<app>.yamlを手動作成済みであることが前提。
    コミット・PR作成のみ行う。productionはCODEOWNERS承認必須のため、マージは必ず人手でレビューのうえ実施する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集。01-promote-productionと同一パスであること)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-production-finish ${option.app}

- name: 03-deploy-production
  group: app-image-update/production
  description: |
    【通常のイメージ更新】02-check-devで確認後に実行。既にproductionにある<app>を
    envs/dev/apps/<app>と同じ内容に同期するPRを、promoteワークフロー(kind=apps)で作成する(昇格=丸ごとコピー)。
    イメージタグに限らずdevに入っている変更はすべて昇格対象になるため、PRのdiffを確認してから
    マージすること。envs/production/apps/<app>がまだ無い場合は01-promote-productionを使う。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh deploy-production ${option.app}

- name: 04-check-production
  group: app-image-update/production
  description: |
    02-promote-production-finish/03-deploy-productionのPRマージ後に実行。productionのWEB疎通を確認する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh check-production ${option.app}
