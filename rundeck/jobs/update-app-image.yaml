# scripts/update-app-image.sh の各サブコマンドを1ジョブずつに対応させたRundeckジョブ定義。
#
# 前提・使い方: docs/manual-rundeck-app-image.md を参照。
# 取り込み方法(例): rd jobs load -p <プロジェクト名> -f rundeck/jobs/update-app-image.yaml --format yaml
#
# 各ジョブの実行対象は以下の2点で決まる(別環境へ持っていく場合はここを編集すること):
#   - nodefilters.filter: "tags: rancher"(踏み台端末=rancherホストのRundeckノードタグ)
#   - option "repo_path" の value: /home/uchida/ibid-fleet-config(踏み台端末上のクローンパス)
#
# 実行順序はscripts/update-app-image.sh冒頭コメントの使用例と同一。各ジョブの後、
# 出力(rollout状況・WEB疎通・PR URL等)を人が確認してから次のジョブを手動実行する運用を
# 前提としており、複数ジョブを自動連結するワークフローは意図的に作っていない。

- name: 01-sync-repo
  group: app-image-update
  description: |
    repo_path のローカルmainブランチをorigin/mainに同期する(git checkout main && git pull --ff-only)。
    各サブコマンドジョブはensure_clean_worktree/require_main_uptodateで同期状態を検証するが、
    PRマージ直後など明示的に同期しておきたいタイミングで実行する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && git checkout main && git pull --ff-only origin main

- name: 02-latest-src-ref
  group: app-image-update
  description: |
    取り込み元リポジトリ(upstream_repo_for/upstream_branch_forに登録済みのブランチ)の
    最新コミットSHA・コミットメッセージを表示する(書き込みなし)。
    次の03-set-imageジョブのsrc_refに使う値を、この出力を見て人が判断する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh latest-src-ref ${option.app}

- name: 03-set-image
  group: app-image-update
  description: |
    images/<app>/TAG・SRC_REFを更新するPRを作成し、CIチェック完了まで待つ(マージはしない)。
    src_refには必ず02-latest-src-refジョブの出力(コミットSHA)を使うこと。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: tag
      description: '新しいイメージタグ(例: 2.0.0-r7)'
      required: true
    - name: src_ref
      description: 取り込み元コミットSHA(16進数7〜40文字。02-latest-src-refジョブの出力を使う)
      required: true
      regex: '^[0-9a-f]{7,40}$'
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh set-image ${option.app} ${option.tag} ${option.src_ref}

- name: 01-deploy-dev
  group: app-image-update/dev
  description: |
    set-imageのPRマージ後、build-<app>-image.yamlの成功を確認したうえで実行する。
    envs/dev/apps/<app>/deployment.yamlのイメージタグを更新するPRを作成する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh deploy-dev ${option.app}

- name: 02-check-dev
  group: app-image-update/dev
  description: |
    01-deploy-devのPRマージ後に実行。devのrollout状況とWEB疎通(readinessProbeのpathで200か)を確認する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh check-dev ${option.app}

- name: 01-promote-staging
  group: app-image-update/staging
  description: |
    envs/dev/apps/<app>をenvs/staging/apps/<app>へコピーし、ホスト名を書き換える
    (ブランチ作成・変更のみでコミットはしない)。

    実行後、ジョブ出力に表示されるkubesealコマンド(GHCR pull用SealedSecret作成)を
    踏み台端末上で人が手動実行すること(PATを扱うためRundeckジョブ化しない)。
    DNS Aレコードが未登録なら合わせて登録する。

    注意: このジョブ実行後、repo_pathの作業ツリーはpromoteブランチ・未コミット状態のまま残る。
    02-promote-staging-finishジョブを実行し終えるまで、同じrepo_pathに対する他のジョブ
    (特に01-sync-repoや05-cleanup-staging等、mainブランチを前提とするもの)を実行しないこと。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-staging ${option.app}

- name: 02-promote-staging-finish
  group: app-image-update/staging
  description: |
    01-promote-stagingジョブでenvs/staging/secrets/<app>.yamlをkubesealにより手動作成済みであることが前提。
    コミット・PR作成・CIチェック待ちまで行う(マージはしない)。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集。01-promote-stagingと同一パスであること)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-staging-finish ${option.app}

- name: 03-deploy-staging
  group: app-image-update/staging
  description: |
    既にstagingに昇格済みの<app>のイメージタグだけを更新するPRを作成する(deploy-devのstaging版)。
    envs/staging/apps/<app>がまだ無い(初回昇格がまだの)場合は01-promote-stagingを使うこと
    (このジョブは対象ディレクトリが存在することが前提で、無ければエラーになる)。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh deploy-staging ${option.app}

- name: 04-check-staging
  group: app-image-update/staging
  description: |
    02-promote-staging-finish/03-deploy-stagingのPRマージ後に実行。stagingのWEB疎通を確認する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh check-staging ${option.app}

- name: 01-promote-production
  group: app-image-update/production
  description: |
    envs/staging/apps/<app>をenvs/production/apps/<app>へコピー。
    実行後、ジョブ出力に表示されるkubesealコマンドを踏み台端末上で人が手動実行すること。

    注意: 01-promote-stagingと同様、実行後repo_pathはpromoteブランチ・未コミット状態のまま残る。
    02-promote-production-finishを実行し終えるまで、同じrepo_pathに対する他のジョブを実行しないこと。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-production ${option.app}

- name: 02-promote-production-finish
  group: app-image-update/production
  description: |
    01-promote-productionジョブでenvs/production/secrets/<app>.yamlを手動作成済みであることが前提。
    コミット・PR作成のみ行う。productionはCODEOWNERS承認必須のため、マージは必ず人手でレビューのうえ実施する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集。01-promote-productionと同一パスであること)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh promote-production-finish ${option.app}

- name: 03-deploy-production
  group: app-image-update/production
  description: |
    既にproductionに昇格済みの<app>のイメージタグだけを更新するPRを作成する(deploy-devのproduction版)。
    envs/production/apps/<app>は初回昇格後も削除されず残り続けるため、2回目以降の更新は
    01-promote-productionではなく必ずこちらを使うこと(01-promote-productionは既存ディレクトリがあると
    エラーになる)。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh deploy-production ${option.app}

- name: 04-check-production
  group: app-image-update/production
  description: |
    02-promote-production-finish/03-deploy-productionのPRマージ後に実行。productionのWEB疎通を確認する。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh check-production ${option.app}

- name: 05-cleanup-staging
  group: app-image-update/staging
  description: |
    production昇格確認(04-check-production)後に実行。stagingのGit定義を削除するPRを作成する。

    注意: マージ後、ジョブ出力に表示されるkubectl delete namespaceコマンドを踏み台端末上で
    人が手動実行すること。keepResources: trueのためGit側の削除だけではnamespaceは消えない。
    順序厳守: PRマージ前にnamespaceを削除すると、まだfleet.yamlを検知しているstagingの
    GitRepoがFleetに再作成させてしまう。
  loglevel: INFO
  executionEnabled: true
  multipleExecutions: false
  timeout: 30m
  nodefilters:
    filter: 'tags: rancher'
  options:
    - name: app
      description: 対象アプリ名
      required: true
      value: brc-advanced-search
      values:
        - brc-advanced-search
        - riken-diips
        - sparqlist
      valuesListDelimiter: ','
      enforced: false
    - name: repo_path
      description: 踏み台端末上のibid-fleet-configクローンパス(要編集)
      required: true
      value: /home/uchida/ibid-fleet-config
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - exec: cd ${option.repo_path} && scripts/update-app-image.sh cleanup-staging ${option.app}
