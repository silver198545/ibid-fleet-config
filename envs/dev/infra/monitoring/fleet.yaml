defaultNamespace: cattle-monitoring-system
targetNamespace: cattle-monitoring-system

# 監視スタックの削除がバンドル削除に連動しないようにする(infraバンドルの方針)。
keepResources: true

# - CRD: ServiceMonitor等のCRDが先に必要(rancher-monitoring-crdのJob適用完了を待つ)
# - secrets: AlertmanagerがマウントするWebhook Secretを先行適用させ、
#   初回適用時のPod Pending(Secret待ち)を避ける。
#   逆方向(monitoring-secrets側からのdependsOn)は絶対に付けないこと
#   (相互待ちのデッドロックになる)。
dependsOn:
  - name: ibid-dev-envs-dev-infra-monitoring-crd
  - name: ibid-dev-envs-dev-infra-monitoring-secrets

# admission webhookのcaBundleはoperatorが実行時に注入するため、
# そのままだとFleetが常にModified(ドリフト)と判定する。比較から除外する。
# rules[].scopeも同様に、マニフェストで未指定でもAPIサーバーがデフォルト値"*"を
# 補完して返すため、比較から除外する(2026-07-07 dev1のDR復元検証時に発覚)。
diff:
  comparePatches:
    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      name: rancher-monitoring-admission
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/0/rules/0/scope
    - apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      name: rancher-monitoring-admission
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
        - /webhooks/0/rules/0/scope
        - /webhooks/1/rules/0/scope

helm:
  # Rancher UI(クラスタ→Monitoring)のGrafanaプロキシ等がこのリリース名を
  # 前提にするため rancher-monitoring 固定。
  releaseName: rancher-monitoring
  chart: rancher-monitoring
  repo: https://charts.rancher.io
  version: 109.0.3+up80.9.1-rancher.14
  # pre-upgrade hook(rancher-monitoring-admission-create Job)がクラスタの
  # 負荷状況によっては既定タイムアウトに間に合わず、Job自体は数十秒後に
  # 成功するのにHelmアップグレードが"context deadline exceeded"で失敗し
  # 値の変更(resources等)が反映されないままFleetが再試行を繰り返す事象が
  # 2026-08-19〜20に発覚。タイムアウトを延長して待つようにする。
  timeoutSeconds: 600
  values:
    # RancherのApps&MarketplaceからインストールするとRancherが自動注入する値だが、
    # Fleet(GitOps)経由だと注入されず空文字列のままになる。その場合Grafanaの
    # nginxプロキシがappSubUrlを"/k8s/clusters//api/v1/..."(クラスタID抜け)で
    # 焼き込み、Rancher UIのMetricsタブがローディングのまま止まる
    # (2026-07-28 dev1/staging1/prod1全クラスタで発生、確認済み)。
    # 値はRancher local clusterで
    #   kubectl get clusters.management.cattle.io -o custom-columns=NAME:.metadata.name,DISPLAY:.spec.displayName
    # を実行して該当クラスタのNAME(c-m-xxxxx)を確認する。
    global:
      cattle:
        clusterId: c-m-62994569

    # RKE2の制御プレーンコンポーネントのexporter(Rancher AppsがRKE2クラスタで
    # 有効化するものと同等)。リソースが厳しくなったら無効化してよい。
    rke2ControllerManager:
      enabled: true
    rke2Scheduler:
      enabled: true
    rke2Proxy:
      enabled: true
    rke2Etcd:
      enabled: true
    rke2IngressNginx:
      enabled: true

    alertmanager:
      secret:
        # falseだとチャートは既存Secretを見つけた時点でconfigの反映をスキップする
        # (初回installでしか反映されない)。Gitを常に正とするためtrue必須。
        # 代償としてRancher UIのRoutes/Receivers編集は次回適用で消える
        # (Alertmanager設定はGit管理のみ — docs/manual-monitoring.md参照)。
        recreateIfExists: true
      alertmanagerSpec:
        # /etc/alertmanager/secrets/alertmanager-slack-webhook/ にマウントされる。
        # Secret実体は monitoring-secrets バンドル(SealedSecret)が供給する。
        secrets:
          - alertmanager-slack-webhook
      config:
        global:
          resolve_timeout: 5m
          # Webhook URLはGitに置かずSecretのファイル参照にする。
          slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
        # 注意: このconfig以下のリスト(inhibit_rules等)はチャート既定と
        # マージされず丸ごと置換される。以下4本はチャート既定の再掲
        # (critical→warning/info、warning→info、InfoInhibitorの抑止)。
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
          - target_matchers:
              - 'alertname = InfoInhibitor'
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: slack-ibid
          routes:
            # Watchdog(常時発報の死活確認用)とinfo系はSlackに流さない。
            - receiver: 'null'
              matchers:
                - 'alertname = "Watchdog"'
            - receiver: 'null'
              matchers:
                - 'severity = info'
        receivers:
          - name: 'null'
          - name: slack-ibid
            slack_configs:
              # channelは旧式Webhookでのみ有効。Slackアプリの
              # Incoming WebhookはURL側でチャンネルが固定され、この値は無視される。
              - channel: '#ibid-alerts'
                send_resolved: true
                title: '[{{ .CommonLabels.cluster }}] {{ .CommonLabels.alertname }} ({{ .Status }})'
                text: >-
                  {{ range .Alerts }}{{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}
                  {{ end }}
        templates:
          - '/etc/alertmanager/config/*.tmpl'

    prometheus:
      prometheusSpec:
        # Slack通知やGrafanaで環境を識別するためのラベル。
        # 環境ごとに dev / staging / production に変える(env間差分)。
        externalLabels:
          cluster: dev
        retention: 10d
        retentionSize: 18GiB
        # チャート既定値(limits.memory: 3000Mi)だとdev1のスクレイプ対象数では
        # 2時間ごとのブロックcompaction時にOOMKilledを繰り返す(2026-08-19に発覚)。
        # 4500Miに引き上げても解消しなかった(12時間で119回再起動)ため6000Miに
        # 再引き上げ。稼働ノードの実使用率は16%程度と余裕があり、7000Miで
        # ノード不安定化が起きたのは別要因だった可能性が高いと判断した。
        # requestsはチャート既定の750Miのままだとlimitsとの乖離が大きく
        # スケジューラ上オーバーコミットになるため、実測の定常時使用量
        # (約2.3Gi)に合わせて2500Miへ引き上げる(Copilotレビュー指摘対応)。
        # 2026-09-01: 全クラスタ再作成でボリュームを新規作成し直した際、
        # 起動直後に全スクレイプ対象(15サイト分のWordPress関連Pod/Service等)
        # を一斉に初回スクレイプするタイミングでメモリスパイクが発生し、
        # 6000Miでも数分以内にOOMKilledするようになった(定常時は約2.3Giだが
        # 起動直後のピークがそれを大きく超える)。稼働ノードのメモリ実使用率は
        # 14〜35%程度で余裕があるため8000Miへ再引き上げ。
        resources:
          requests:
            cpu: 750m
            memory: 2500Mi
          limits:
            cpu: "1"
            memory: 8000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
        # 全WordPressサイトのHTTP死活監視。
        # LB IPは動的割当でGitに無いため、Service(ClusterIP DNS)を
        # kubernetes SDで動的発見して blackbox-exporter 経由でprobeする。
        # サイトが増えても監視設定の追加は不要。
        # クラスタ内経由のためLB IP経路の障害は検知できない点に注意
        # (docs/manual-monitoring.md の残課題を参照)。
        additionalScrapeConfigs:
          - job_name: blackbox-wordpress-http
            metrics_path: /probe
            params:
              module: [http_wordpress]
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              # wordpress-* namespaceのServiceのみ対象
              - source_labels: [__meta_kubernetes_namespace]
                regex: wordpress-.+
                action: keep
              # port名 http のみ(mariadb等のServiceを除外)
              - source_labels: [__meta_kubernetes_service_port_name]
                regex: http
                action: keep
              # 発見したService DNSをprobe対象URLにする
              - source_labels: [__address__]
                regex: (.+)
                target_label: __param_target
                replacement: http://$1/
              - source_labels: [__param_target]
                target_label: instance
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_service_name]
                target_label: service
              # 実際のscrape先はblackbox-exporter
              - target_label: __address__
                replacement: monitoring-blackbox-exporter.cattle-monitoring-system.svc:9115

    # Grafanaのstorageはchart既定のemptyDir(ダッシュボード/データソースは
    # ConfigMapで管理され、SQLite DBは揮発性データのみを保持する想定のため)。
    # そのためPod再作成のたびに数百件のDBマイグレーションを最初からやり直す。
    # dev1クラスタの慢性的なストレージI/O遅延と組み合わさり、chart既定の
    # livenessProbe(initialDelaySeconds:60 + failureThreshold:10 = 160秒許容)
    # では完了前にKillされてクラッシュループする(2026-09-02に発覚)。
    # マイグレーションは繰り返してもemptyDirである以上何度でも起こるため、
    # 恒久的にprobeを緩和する(600秒許容)。
    grafana:
      livenessProbe:
        initialDelaySeconds: 300
        failureThreshold: 30
