# production固有: ホスト名(<app>.production.ibid.lan)。リストは丸ごと置き換わるため全体を書く。
spec:
  tls:
    - hosts:
        - jmc-web.production.ibid.lan
      secretName: jmc-web-tls
  rules:
    - host: jmc-web.production.ibid.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jmc-web
                port:
                  number: 80
