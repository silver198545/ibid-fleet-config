apiVersion: apps/v1
kind: Deployment
metadata:
  name: jmc-web
  namespace: jmc-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jmc-web
  template:
    metadata:
      labels:
        app: jmc-web
      annotations:
        # configmap-nginx.yamlを変えたら上げる(Podを作り直して新しい設定を読ませるため)
        jmc-web/nginx-conf-rev: "1"
    spec:
      containers:
        - name: jmc-web
          # 公式nginxの非root版(stable系)。独自イメージは作らず、Bitnamiイメージと同じくdigestで固定する。
          # 更新はタグとdigestを書き換えてdevから昇格する(docs/manual-apps.md「jmc-web 固有のメモ」)。
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # 全環境で同じNFSディレクトリを共有するため、どの環境でも読み取り専用(pv-nfs-content.yaml参照)
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readinessはNFS上のトップページで見る(中身が読めないPodにはアクセスを流さない)。
          # livenessはnginx自体の生存だけを見る(NFSが一時的に遅いだけで再起動させない)。
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: jmc-web-content
            readOnly: true
        - name: nginx-conf
          configMap:
            name: jmc-web-nginx
