# 日本マウスクリニックの静的サイト(旧jmcenのApache /var/www/html。HTML・画像・PDFのみで
# .htaccess・SSI・PHP/CGIは無い)。中身(約730MB)はイメージにもGitにも入れず、NFS上のディレクトリ
# (pv-nfs-content.yaml)をdev/staging/productionの全環境が読み取り専用でマウントし、公式nginxイメージで配る。
# 他のapps/と異なり images/jmc-web/ は無い(独自イメージのビルド・SRC_REF・GHCR pull用Secretが無い)。
# 中身の更新はNFS上のファイルを直接書き換える(全環境に即反映。Gitの昇格の対象はnginxの版と設定だけ)。
# 詳細は docs/manual-apps.md「jmc-web 固有のメモ」参照。
defaultNamespace: jmc-web
targetNamespace: jmc-web

keepResources: true

helm:
  releaseName: jmc-web

# 環境ごとの差分。このディレクトリはdev/staging/productionで同一内容に保ち、昇格は丸ごとコピーで行う
# (docs/operations-flow.md「環境差分の書き方」参照)。直下のマニフェストはdevの値で書き、
# staging・productionで変える部分だけを overlays/<env>/ に置く(<file>_patch.yaml は同名
# マニフェストへのパッチ)。overlays/ 配下は選ばれた環境でしか使われない。
targetCustomizations:
  # stagingはproductionに近い設定で、レプリカ1(overlays/staging/)。
  - name: staging
    clusterSelector:
      matchLabels:
        env: staging
    yaml:
      overlays:
        - staging
  - name: production
    clusterSelector:
      matchLabels:
        env: production
    yaml:
      overlays:
        - production
