# バイオリソースの検索API(d-usuda/elasticBioresourceSearch)。brc-cross-search(xsearch)の
# 一覧・絞り込み・統計グラフが呼ぶ GET /api/v1/search の提供元。本家の compose.yaml と同じ4つの部品を
# 1つのnamespaceに置く:
#   - bioresource-search(Deployment): 検索API・管理API(api)と取込worker(worker)の2コンテナ。
#     ジョブDB(SQLite)と取込のステージングを共有するため同じPodに入れ、1つのPVC(RWO)を共有する
#   - bioresource-search-es(StatefulSet): Elasticsearch 9(kuromoji・icu入り)。1ノード・認証なし
#     (本家と同じ)のため、NetworkPolicyでこのnamespaceのapi・worker以外からは届かないようにする
#   - bioresource-search-frontend(Deployment): 検証用UI(検索・チューニング・管理画面)。/api はapiへ中継
# 詳細は docs/manual-apps.md「bioresource-search 固有のメモ」参照。
defaultNamespace: bioresource-search
targetNamespace: bioresource-search

keepResources: true

helm:
  releaseName: bioresource-search

# 環境ごとの差分。このディレクトリはdev/staging/productionで同一内容に保ち、昇格は丸ごとコピーで行う
# (docs/operations-flow.md「環境差分の書き方」参照)。直下のマニフェストはdevの値で書き、
# staging・productionで変える部分だけを overlays/<env>/ に置く(<file>_patch.yaml は同名
# マニフェストへのパッチ)。overlays/ 配下は選ばれた環境でしか使われない。
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        env: staging
    yaml:
      overlays:
        - staging
  - name: production
    clusterSelector:
      matchLabels:
        env: production
    yaml:
      overlays:
        - production
