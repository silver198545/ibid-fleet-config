# WordPressサイトではない自作アプリ(member-gateway、https://github.com/silver198545/member-gateway)。
# 入力されたメールアドレスをkintone(アプリ360)に照会し、会員状態に応じてトヨクモの各ページへ
# 案内するステートレスなAPIサーバー(DB・PVCなし)のため、sites/ とは分けてapps/配下に置く。
# kintoneのAPIトークンは環境ごとのSealedSecret(envs/<env>/secrets/member-gateway-kintone.yaml)から注入する。
# 詳細は docs/manual-apps.md「member-gateway 固有のメモ」参照。
defaultNamespace: member-gateway
targetNamespace: member-gateway

keepResources: true

helm:
  releaseName: member-gateway

# 環境ごとの差分。このディレクトリはdev/staging/productionで同一内容に保ち、昇格は丸ごとコピーで行う
# (docs/operations-flow.md「環境差分の書き方」参照)。直下のマニフェストはdevの値で書き、
# staging・productionで変える部分だけを overlays/<env>/ に置く(<file>_patch.yaml は同名
# マニフェストへのパッチ)。overlays/ 配下は選ばれた環境でしか使われない。
targetCustomizations:
  # stagingはproductionに近い設定で、レプリカ1・共有NFSは読み取り専用のまま(overlays/staging/)。
  - name: staging
    clusterSelector:
      matchLabels:
        env: staging
    yaml:
      overlays:
        - staging
  - name: production
    clusterSelector:
      matchLabels:
        env: production
    yaml:
      overlays:
        - production
