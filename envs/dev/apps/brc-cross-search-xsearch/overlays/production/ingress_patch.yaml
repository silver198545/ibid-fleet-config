# production固有: ホスト名(<app>.production.ibid.lan)。リストは丸ごと置き換わるため全体を書く。
spec:
  tls:
    - hosts:
        - brc-cross-search-xsearch.production.ibid.lan
      secretName: brc-cross-search-xsearch-tls
  rules:
    - host: brc-cross-search-xsearch.production.ibid.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brc-cross-search-xsearch
                port:
                  number: 80
