# production固有: ホスト名(<app>.production.ibid.lan)。リストは丸ごと置き換わるため全体を書く。
spec:
  tls:
    - hosts:
        - brc-advanced-search.production.ibid.lan
      secretName: brc-advanced-search-tls
  rules:
    - host: brc-advanced-search.production.ibid.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brc-advanced-search
                port:
                  number: 80
