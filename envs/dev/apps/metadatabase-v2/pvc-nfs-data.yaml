# アップロードされたRDFデータファイル・まとめダウンロード用zipの保存先(コンテナの/mnt)。
# 外部NFS(kvm1.masuya.brc.riken.jp、既存のnfs-externalと同じサーバー)を
# nfs-external-apps(apps/配下で隔離するStorageClass)経由でマウントする。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metadatabase-v2-nfs-data
  namespace: metadatabase-v2
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-external-apps
  resources:
    requests:
      storage: 100Gi
