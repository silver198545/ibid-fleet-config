# production固有: 直下の同名ファイルを丸ごと置き換える(本番専用のbioresourceディレクトリ)。
# 既存のダウンロード用zip置き場(/data/nfs/download/bioresource、本番の実データ)を
# そのままマウントするための静的PV/PVC。詳細はpv-nfs-uploadrdf.yaml参照。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: metadatabase-v2-download-bioresource
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: metadatabase-v2-download-bioresource
    volumeAttributes:
      server: "192.168.1.1"
      share: "/data/nfs"
      subDir: "download/bioresource"
      mountPermissions: "0777"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metadatabase-v2-download-bioresource
  namespace: metadatabase-v2
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: metadatabase-v2-download-bioresource
  resources:
    requests:
      storage: 100Gi
