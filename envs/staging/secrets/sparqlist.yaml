# sparqlist のADMIN_PASSWORD用SealedSecret(値は全環境共通)(staging環境)。2026-10-25にdev1の値からstaging1の鍵で封印し直した。
# 封印された値はstaging1のコントローラでのみ復号できる(他環境へのコピー不可)。
---
# アプリのnamespace。SealedSecretより先に適用されるようバンドルに含める(既存namespaceの引き取りは secrets/fleet.yaml の takeOwnership)。
apiVersion: v1
kind: Namespace
metadata:
  name: sparqlist
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sparqlist-admin-password
  namespace: sparqlist
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: sparqlist-admin-password
      namespace: sparqlist
    type: Opaque
