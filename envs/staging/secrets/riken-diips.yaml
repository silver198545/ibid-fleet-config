# riken-diips のGHCR pull用SealedSecret(staging環境)。2026-10-25にdev1の値からstaging1の鍵で封印し直した。
# 封印された値はstaging1のコントローラでのみ復号できる(他環境へのコピー不可)。
---
# アプリのnamespace。SealedSecretより先に適用されるようバンドルに含める(既存namespaceの引き取りは secrets/fleet.yaml の takeOwnership)。
apiVersion: v1
kind: Namespace
metadata:
  name: riken-diips
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-riken-diips
  namespace: riken-diips
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-riken-diips
      namespace: riken-diips
    type: kubernetes.io/dockerconfigjson
