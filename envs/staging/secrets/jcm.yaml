# サイト jcm (staging環境)の認証情報SealedSecret。
# scripts/seal-site-secrets.sh で生成。封印された値はこの環境のコントローラ
# でのみ復号できる(他環境へのコピー不可。環境ごとに生成し直すこと)。
# パスワードのローテーション手順は docs/manual-wordpress.md 参照。
---
# サイトのnamespace。SealedSecretより先に適用されるようバンドルに含める
# (DR時の手動 kubectl create ns を不要にする)。既存namespaceの引き取りは、このファイルと同じ
# ディレクトリの fleet.yaml(envs/staging/secrets/fleet.yaml。サイトの fleet.yaml ではない)の
# takeOwnership: true が担う。
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress-jcm
  annotations:
    # Rancherのプロジェクト(このnamespaceを操作できるオペレータの範囲)。環境ごとのIDなので、
    # このファイル(環境ごとに生成し直す)にだけ書く
    field.cattle.io/projectId: "c-m-qqhsg9c2:p-vk6k8"
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wordpress-jcm-credentials
  namespace: wordpress-jcm
spec:
  encryptedData:
    wordpress-password: 
  template:
    metadata:
      name: wordpress-jcm-credentials
      namespace: wordpress-jcm
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wordpress-jcm-mariadb-credentials
  namespace: wordpress-jcm
spec:
  encryptedData:
    mariadb-password: 
    mariadb-root-password: 
  template:
    metadata:
      name: wordpress-jcm-mariadb-credentials
      namespace: wordpress-jcm
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wordpress-jcm-mariadb-upgrade-values
  namespace: wordpress-jcm
spec:
  encryptedData:
    values.yaml: 
  template:
    metadata:
      name: wordpress-jcm-mariadb-upgrade-values
      namespace: wordpress-jcm
