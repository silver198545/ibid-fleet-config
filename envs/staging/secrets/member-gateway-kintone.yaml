# member-gateway のkintone用SealedSecret(devと同じトークン)(staging環境)。2026-10-25にdev1の値からstaging1の鍵で封印し直した。
# 封印された値はstaging1のコントローラでのみ復号できる(他環境へのコピー不可)。
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: member-gateway-kintone
  namespace: member-gateway
spec:
  encryptedData:
    api-token: 
    base-url: 
  template:
    metadata:
      name: member-gateway-kintone
      namespace: member-gateway
    type: Opaque
