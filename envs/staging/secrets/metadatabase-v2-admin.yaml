# metadatabase-v2 の管理画面用SealedSecret(SECRET_KEY・初期パスワードはstaging用に新規生成)(staging環境)。2026-10-25にdev1の値からstaging1の鍵で封印し直した。
# 封印された値はstaging1のコントローラでのみ復号できる(他環境へのコピー不可)。
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: metadatabase-v2-admin
  namespace: metadatabase-v2
spec:
  encryptedData:
    ADMIN_INITIAL_PASSWORD: 
    ADMIN_SECRET_KEY: 
    VIRTUOSO_ISQL_PASSWORD: 
  template:
    metadata:
      name: metadatabase-v2-admin
      namespace: metadatabase-v2
