# ibid運用の独自アラートルール。
# ノード障害・Pod異常等の汎用アラートはkube-prometheus-stack既定ルールが
# カバーするため、ここには「サイト死活」「バックアップ」のみ置く。
# stagingはLonghornを置かないため、productionにあるLonghornのルールは無い。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ibid-alerts
  namespace: cattle-monitoring-system
spec:
  groups:
    - name: wordpress.uptime
      rules:
        - alert: WordPressSiteDown
          expr: probe_success{job="blackbox-wordpress-http"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'WordPressサイト {{ $labels.namespace }} ({{ $labels.instance }}) がHTTP応答しません'
        - alert: WordPressSiteSlow
          expr: probe_duration_seconds{job="blackbox-wordpress-http"} > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'WordPressサイト {{ $labels.namespace }} の応答が5秒を超えています({{ $value | humanizeDuration }})'

    - name: wordpress.backup
      rules:
        # サイトの日次バックアップCronJob(charts/ibid-wordpress の <release>-backup、JST 03:00)が
        # 26時間以上成功していない。WordPressのDB・wp-contentはLonghornの定期バックアップの
        # 対象外なので、これが唯一の定期バックアップになる(docs/roadmap.md 項目5)。
        - alert: WordPressBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace=~"wordpress-.*", cronjob=~"wordpress-.*-backup"} > 26 * 60 * 60
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'WordPressサイト {{ $labels.namespace }} の日次バックアップが26時間以上成功していません'
        # 一度も成功していない(作成から26時間以上経っても成功記録が無い)場合は、
        # 上のルールでは検知できない(last_successful_timeが存在しない)ため別に見る。
        - alert: WordPressBackupNeverSucceeded
          expr: (time() - kube_cronjob_created{namespace=~"wordpress-.*", cronjob=~"wordpress-.*-backup"} > 26 * 60 * 60) unless on(namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'WordPressサイト {{ $labels.namespace }} の日次バックアップが一度も成功していません'

    - name: apps.cronjob
      rules:
        # brc-cross-search-resourceのsitemap更新CronJob(JST 20:00)が26時間以上成功していない。
        # Googlebotの巡回(およそ21時)に古いsitemapが出続ける(envs/<env>/apps/brc-cross-search-resource/cronjob-sitemap.yaml)。
        # 書き込み先をdevと共有しているためdevではCronJobを止めており(suspend)、止めている間は対象外にする。
        - alert: BrcCrossSearchSitemapStale
          expr: (time() - kube_cronjob_status_last_successful_time{namespace="brc-cross-search-resource", cronjob="brc-cross-search-resource-sitemap"} > 26 * 60 * 60) unless on(namespace, cronjob) kube_cronjob_spec_suspend == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'brc-cross-search-resourceのsitemap更新が26時間以上成功していません'
        - alert: BrcCrossSearchSitemapNeverSucceeded
          expr: (time() - kube_cronjob_created{namespace="brc-cross-search-resource", cronjob="brc-cross-search-resource-sitemap"} > 26 * 60 * 60) unless on(namespace, cronjob) kube_cronjob_status_last_successful_time unless on(namespace, cronjob) kube_cronjob_spec_suspend == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'brc-cross-search-resourceのsitemap更新が一度も成功していません'
