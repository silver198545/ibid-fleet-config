apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparqlist
  namespace: sparqlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparqlist
  template:
    metadata:
      labels:
        app: sparqlist
    spec:
      # repository/(NFS、pv-nfs-shared.yaml)への書き込み(productionのみ)は非root実行の
      # コンテナから行うため、fsGroupでボリュームのグループ所有権を付与する(bitnamiチャートの
      # podSecurityContext.fsGroupと同じ考え方。ベースイメージのUID/GIDに依存しない)。
      securityContext:
        fsGroup: 1000
      containers:
        - name: sparqlist
          image: ghcr.io/silver198545/sparqlist:1.0.0-r0
          ports:
            - name: http
              containerPort: 3000
          env:
            # 管理API(SPARQLetの作成・編集)を保護するパスワード。SealedSecretから注入する
            # (scripts/seal-sparqlist-secret.sh <env> で環境ごとに生成。docs/manual-apps.md参照)。
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparqlist-admin-password
                  key: admin-password
          volumeMounts:
            # devとproductionで同じNFSディレクトリを共有するため、devは読み取り専用にする
            # (SPARQLetの編集はproductionでだけ行う。overlays/production/deployment_patch.yaml で
            # productionだけ書き込み可にしている。pv-nfs-shared.yaml参照)。
            - name: repository
              mountPath: /app/repository
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # SPARQLetによっては10〜30MBの結果をまとめてメモリに載せるため(limit無しで
            # 数十万件を返すものもある)、512MiではOOMKilledが頻発した(2026-10-13)。
            limits:
              memory: 2Gi
          # ROOT_PATH(/sparqlist/、Dockerfileに焼き込み済み)配下にしかルートが無いため、
          # ベアの"/"は404になる。
          readinessProbe:
            httpGet:
              path: /sparqlist/
              port: 3000
          livenessProbe:
            httpGet:
              path: /sparqlist/
              port: 3000
      volumes:
        - name: repository
          persistentVolumeClaim:
            claimName: sparqlist-repository-shared
