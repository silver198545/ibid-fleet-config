# WordPressサイトではない自作アプリ(SPARQList、https://github.com/dbcls/sparqlist)。
# DBは持たないが、他のapps/配下のアプリ(brc-advanced-search・riken-diips)と異なり
# 保存したSPARQLet(repository/配下)の永続化が必要なため、pv-nfs-shared.yamlで
# devとproductionが共有するNFS上のディレクトリをマウントする(編集はproductionだけ)。
# sites/ に置かないのは、Bitnami WordPress前提(ラッパーチャート・3種のSecret等)を
# 暗黙に含まないため。詳細は docs/manual-apps.md 参照。
defaultNamespace: sparqlist
targetNamespace: sparqlist

keepResources: true

helm:
  releaseName: sparqlist

# 環境ごとの差分。このディレクトリはdev/staging/productionで同一内容に保ち、昇格は丸ごとコピーで行う
# (docs/operations-flow.md「環境差分の書き方」参照)。直下のマニフェストはdevの値で書き、
# staging・productionで変える部分だけを overlays/<env>/ に置く(<file>_patch.yaml は同名
# マニフェストへのパッチ)。overlays/ 配下は選ばれた環境でしか使われない。
targetCustomizations:
  # stagingはproductionに近い設定で、レプリカ1・共有NFSは読み取り専用のまま(overlays/staging/)。
  - name: staging
    clusterSelector:
      matchLabels:
        env: staging
    yaml:
      overlays:
        - staging
  - name: production
    clusterSelector:
      matchLabels:
        env: production
    yaml:
      overlays:
        - production
