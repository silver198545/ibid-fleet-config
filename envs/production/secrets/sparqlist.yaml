# sparqlist (production環境)のADMIN_PASSWORD用SealedSecret。
# scripts/seal-sparqlist-secret.sh で生成。封印された値はこの環境の
# コントローラでのみ復号できる(他環境へのコピー不可。環境ごとに生成し直すこと)。
---
# アプリのnamespace。SealedSecretより先に適用されるようバンドルに含める
# (DR時の手動 kubectl create ns を不要にする)。既存namespaceの引き取りは
# envs/<env>/secrets/fleet.yaml の takeOwnership: true が担う。
apiVersion: v1
kind: Namespace
metadata:
  name: sparqlist
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sparqlist-admin-password
  namespace: sparqlist
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: sparqlist-admin-password
      namespace: sparqlist
