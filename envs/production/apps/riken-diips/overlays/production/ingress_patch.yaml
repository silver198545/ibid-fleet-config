# production固有: ホスト名(<app>.production.ibid.lan)。リストは丸ごと置き換わるため全体を書く。
spec:
  tls:
    - hosts:
        - riken-diips.production.ibid.lan
      secretName: riken-diips-tls
  rules:
    - host: riken-diips.production.ibid.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: riken-diips
                port:
                  number: 80
