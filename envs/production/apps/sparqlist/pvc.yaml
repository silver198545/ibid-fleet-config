# SPARQListが保存するSPARQLet(Markdown設定ファイル)の永続化用ボリューム。
# WordPressのwp-contentと同じくRWX(longhorn-r1)にしておくことで、将来replicasを
# 2以上に増やしても複数Podから同じディレクトリを共有できる(容量は小さいテキスト
# ファイルのみのため2Giで十分な想定。不足時はここを増やす)。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sparqlist-repository
  namespace: sparqlist
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-r1
  resources:
    requests:
      storage: 2Gi
