# 【移行中・未使用】以前SPARQLetの保存先に使っていたLonghorn RWXボリューム(longhorn-r1)。
# 2026-10-21からrepository/はdev/production共有のNFS(pv-nfs-shared.yaml)に移した。
# このファイルをバンドルから消すとHelmがPVCを削除し、Longhornボリュームも中身ごと消える。
# productionの切替後にNFS側のデータを確認するまでは、切り戻し用に残しておく
# (確認後にこのファイルを消すPRをdev→productionの順に出す。docs/manual-apps.md「sparqlist 固有のメモ」)。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sparqlist-repository
  namespace: sparqlist
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-r1
  resources:
    requests:
      storage: 2Gi
