# WordPressサイトではない自作アプリ(brc-cross-search の「横断検索」、APP_MODE=xsearch)。
# DBを持たず外部のSPARQLエンドポイント(knowledge.brc.riken.jp)を参照するだけの
# ステートレスなアプリのため、sites/ とは分けてapps/配下に置く。
# 同じソースの brc-cross-search-resource は別アプリ(別namespace)として展開している。
# 詳細は docs/manual-apps.md 参照。
defaultNamespace: brc-cross-search-xsearch
targetNamespace: brc-cross-search-xsearch

keepResources: true

helm:
  releaseName: brc-cross-search-xsearch

# 環境ごとの差分。このディレクトリはdev/staging/productionで同一内容に保ち、昇格は丸ごとコピーで行う
# (docs/operations-flow.md「環境差分の書き方」参照)。直下のマニフェストはdevの値で書き、
# staging・productionで変える部分だけを overlays/<env>/ に置く(<file>_patch.yaml は同名
# マニフェストへのパッチ)。overlays/ 配下は選ばれた環境でしか使われない。
targetCustomizations:
  # stagingはproductionに近い設定で、レプリカ1・共有NFSは読み取り専用のまま(overlays/staging/)。
  - name: staging
    clusterSelector:
      matchLabels:
        env: staging
    yaml:
      overlays:
        - staging
  - name: production
    clusterSelector:
      matchLabels:
        env: production
    yaml:
      overlays:
        - production
