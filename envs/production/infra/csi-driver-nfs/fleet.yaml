# dev1のLonghorn RWX(share-manager/NFS-Ganesha)で断続的なRemote I/O errorが解消しない
# 問題への対応検証(docs/manual-storage-migration.md参照)。NFS-Ganeshaを経由せず、
# 既存の外部NFSサーバー(192.168.1.1、Longhornバックアップ先と同一ホスト)に直接
# RWXボリュームをマウントできるようにする、kubernetes-csi公式のCSIドライバ。
# devで有効性を確認済み(2026-09-04に全サイト移行)。productionにも2026-10-09に導入した。
defaultNamespace: kube-system
keepResources: true

helm:
  releaseName: csi-driver-nfs
  chart: csi-driver-nfs
  repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  version: 4.13.4
