# 全WordPressサイト共通のデフォルトHelm values(旧 wordpress-base-values.yaml を移設)。
# サブチャート(bitnami/wordpress)へ渡す値はすべて `wordpress:` キーの配下に置くこと。
# サイト固有の差分(existingSecretの名前、テーブル接頭辞の上書き等)は
# envs/<env>/sites/<site>/fleet.yaml の helm.values 側に書く。
# このファイルを変更したら Chart.yaml の version も必ず上げること。

# サイトが必要とするプラグインの宣言的な一覧(templates/plugin-sync-job.yaml)。
# helm適用のたびにwp-cliのJobがインストール(バージョン固定)・有効化する。
# 環境間の再現性のため version の明示を推奨。一覧から消しても自動削除はしない
# (稼働中サイトのプラグイン自動削除は危険なため。削除は手動: wp plugin delete)。
# 通常はチャート側ではなく、各サイトの fleet.yaml の helm.values.plugins に書く。
plugins: []
# plugins:
#   - name: advanced-custom-fields
#     version: "6.8.4"
#   - name: classic-editor
#     version: "1.7.0"
#     activate: false   # インストールのみで有効化しない場合

# サイトの日次バックアップ(templates/backup-cronjob.yaml)。DBダンプとwp-contentのtarを
# NFS上の backup/<env>/<namespace>/ に置く。DB(harvester)とwp-content(nfs-external)は
# ゲストLonghornの定期バックアップの対象外のため、サイト自身で取る(docs/roadmap.md 項目5)。
# 形式は scripts/restore-wordpress.sh でそのまま戻せる <yyyymmdd_hhmm>.dump.gz / .tar.gz。
backup:
  enabled: true
  # JST(CronJobのtimeZone)。Longhornのbackup-daily(JST 2:00)と重ならない時刻にする
  schedule: "0 3 * * *"
  retentionDays: 14
  # envs/<env>/infra/csi-driver-nfs-storageclass/ で定義。両環境ともreclaimPolicy: Retain
  storageClass: nfs-backup
  # NFSではサイズは制限として効かない(PVCの必須項目として書いているだけ)
  size: 20Gi

# PHPの追加設定(templates/php-opcache-ini.yaml)。
php:
  # OPcacheがファイルの更新を確かめる間隔(秒)。Bitnamiの既定60秒だと、プラグイン更新後に
  # 最長60秒500が出る。小さくするほどNFS上のファイルのstatが増える(wp-contentはnfs-external)。
  opcacheRevalidateFreq: 2

wordpress:
  # PHPの追加設定ファイルを、php.iniが追加で読む conf.d に置く(templates/php-opcache-ini.yaml)
  extraVolumes:
    - name: php-opcache-ini
      configMap:
        name: php-opcache-ini
  extraVolumeMounts:
    - name: php-opcache-ini
      mountPath: /opt/bitnami/php/etc/conf.d/zz-ibid-opcache.ini
      subPath: zz-ibid-opcache.ini

  # docker.io/bitnami の無償イメージは2025年後半のBroadcom移行以降 `latest` タグしか
  # 提供されないため、digestで固定して全環境・全サイトの再現性を確保する。
  # (digest未固定だとPod再作成のたびに中身の異なる`latest`を引く恐れがある)
  # 更新時はこのdigestを差し替え、Chart.yamlのversionを上げて環境ごとに昇格させる
  # (scripts/bump-chart.sh。docs/manual-multi-env.md 4章「イメージ更新」)。
  image:
    registry: docker.io
    repository: bitnami/wordpress
    tag: latest
    digest: sha256:845d250ecd73f5e9b8ab2c42ab8b32407992456bab4dcb79547f2c0b7d25959b

  # Web層のデフォルトは1レプリカ(dev向け)。production は冗長化のため
  # 各サイトのfleet.yamlの targetCustomizations で replicaCount: 2 +
  # podAntiAffinityPreset: hard を上書きする。wp-content は ReadWriteMany の
  # ボリュームで全レプリカ間共有するため、レプリカ数を変えてもマウント方式は変わらない。
  replicaCount: 1

  # 既定はLoadBalancer(サイト個別IP)。現在の全サイトは、scripts/new-wordpress-site.sh が
  # 生成するfleet.yamlでこのブロックとingressを下記例のように上書きしている
  # (docs/manual-harvester-loadbalancer.md「Traefikを LoadBalancer 化する」参照)。
  # service:
  #   type: ClusterIP
  # ingress:
  #   enabled: true
  #   ingressClassName: traefik
  #   hostname: <site>.<env>.ibid.lan
  #   tls: true
  #   annotations:
  #     cert-manager.io/cluster-issuer: freeipa-acme
  service:
    type: LoadBalancer

  # 既定は longhorn-r1(二重増幅対策。docs/roadmap.md 項目3)。現在の全サイトは、
  # Longhorn RWXのRemote I/O error対策で fleet.yaml により nfs-external(外部NFS)へ
  # 上書きしている(docs/manual-storage-migration.md)。
  persistence:
    enabled: true
    storageClass: longhorn-r1
    accessModes:
      - ReadWriteMany
    size: 10Gi

  wordpressUsername: admin
  wordpressEmail: admin@example.com

  # 全サイト共通のデフォルトのテーブル接頭辞。Bitnamiチャート自体のデフォルトは wp_ だが、
  # このクラスタ群では tp_ を標準として使う。サイトごとに変える必要がある場合は
  # envs/<env>/sites/<site>/fleet.yaml の helm.values で上書きする。
  wordpressTablePrefix: "tp_"

  # readinessProbeはPod IP宛てにhttpで /wp-login.php を叩くが、WP_HOMEが
  # https://<site>.<env>.ibid.lan に固定されたサイトでは別ホストへの302が返り、
  # kubeletは追従せず成功扱いにして毎回 ProbeWarning(Probe terminated redirects)を出す。
  # TLS終端(Traefik)経由のリクエストと同じヘッダを付けて200を返させる。
  # httpGetの他のキー(path/port/scheme)はBitnamiチャートの既定値がそのまま使われる。
  readinessProbe:
    httpGet:
      httpHeaders:
        - name: X-Forwarded-Proto
          value: https

  mariadb:
    enabled: true
    architecture: standalone
    # WordPress本体と同じ理由でdigest固定。
    image:
      registry: docker.io
      repository: bitnami/mariadb
      tag: latest
      digest: sha256:354e5aec20455bce931a05fa791c51e4a45879015bee09591295c76fe88c037e
    auth:
      database: bitnami_wordpress
      username: bn_wordpress
    primary:
      # 初回初期化(mysql_install_db〜DB作成)は同期書き込みが多く、ストレージが遅い環境では
      # 2分半を超える。既定のlivenessProbe(起動120秒後から判定・3回失敗で強制終了)だと
      # 初期化途中で殺されてibdata1が壊れ、以後起動不能になる(2026-10-08、prod1の
      # harvesterボリュームでfsync約260ms/回 → web/dnaの新規インストールで発生)。
      # startupProbeで初期化を最大約10分待ち(成功するまでlivenessは動かない)、
      # 各probeのタイムアウトも1秒→5秒に延ばしてI/O待ちでの誤判定を避ける。
      startupProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 40
      livenessProbe:
        timeoutSeconds: 5
      readinessProbe:
        timeoutSeconds: 5
      # RWOのみのため、Harvester CSI driverが提供する harvester StorageClass に
      # 直接乗せる。ゲストクラスタのLonghornを経由しないため二重増幅を避けられる
      # (Harvester側の3重化のみになる。docs/roadmap.md 項目3参照)。
      persistence:
        enabled: true
        storageClass: harvester
        accessModes:
          - ReadWriteOnce
        size: 8Gi
      # Bitnamiイメージの起動スクリプト(libmariadb.sh)は、既存データで起動するたびに
      # ${DB_BIN_DIR}/mariadb_upgrade を呼ぶが、実在するのは mariadb-upgrade(ハイフン)だけで、
      # 失敗は「This installation is already upgraded」と表示して握りつぶされる。そのままだと
      # メジャー更新(例: 12.3→13.1、チャート0.6.2)後もシステムテーブルが旧版のまま残る
      # (2026-10-10、web-rhの本番データリハーサルで発覚)。正しいバイナリへ渡すだけの
      # スクリプトを mariadb_upgrade として置き(templates/mariadb-upgrade-shim.yaml)、
      # Bitnami本来の「起動時に必要ならアップグレード」を効かせる(既に最新なら数秒で終わる)。
      extraVolumes:
        - name: mariadb-upgrade-shim
          configMap:
            name: mariadb-upgrade-shim
            defaultMode: 0555
      extraVolumeMounts:
        - name: mariadb-upgrade-shim
          mountPath: /opt/bitnami/mariadb/bin/mariadb_upgrade
          subPath: mariadb_upgrade
