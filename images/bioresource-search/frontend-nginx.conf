# bioresource-search の検証用 UI(frontend)の nginx 設定。
# アプリ本家の frontend/nginx.conf(d-usuda/elasticBioresourceSearch)を k8s 向けに変えたもの。
# build-bioresource-search-image.yaml がビルド前に app/frontend/nginx.conf をこのファイルで置き換える。
# 本家との違いは中継先だけ:
#   - 本家は Docker の DNS(127.0.0.11)で compose のサービス名 api を引き直している。
#     k8s では api の Service(ClusterIP)の IP は Pod を作り直しても変わらないので、resolver は使わず
#     同じ namespace の Service 名 bioresource-search-api を upstream にして起動時に 1 回だけ引く
#     (proxy_pass の変数が upstream の名前と一致すれば、要求のたびの名前解決は要らない)。
# 本家の nginx.conf が変わったら、ここにも同じ変更を入れること(docs/manual-apps.md「bioresource-search 固有のメモ」)。
upstream bioresource_api {
    server bioresource-search-api:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    set $api http://bioresource_api;

    # API への要求は api サービスに中継する（画面と API を同じオリジンにして、CORS を要らなくする）
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
    # クエリの試し実行は、全体の行数を数えるため数分かかることがある
    location = /api/v1/admin/ingest-config/test-query {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 900s;
    }
    location ~ ^/(healthz|readyz)$ {
        proxy_pass $api;
    }

    # ビルドしたファイルは名前にハッシュが付くので、長くキャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 画面の中のパス（/admin/jobs/... など）は index.html を返し、React Router に任せる
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
